spring.application.name=driver-vehicle-service

# ---- Server / MongoDB: values come from environment variables (defaults are for local development only) ----
server.port=${SERVER_PORT:8082}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:ridelink_driver_vehicle_db}
# Needed so @Indexed(unique = true) (accountId, licenseNumber, vehicleNumber) really creates the indexes
spring.data.mongodb.auto-index-creation=true

# ---- Business configuration ----
# Simulated search radius (km) used when Ride Management supplies latitude/longitude
ridelink.eligibility.search-radius-km=${SEARCH_RADIUS_KM:5.0}

# ---- Security (JWT issued by the Account Service) ----
# false = all endpoints open (easy local demo). true = JWT required and roles enforced.
ridelink.security.enabled=${SECURITY_ENABLED:false}
# Shared HS256 secret. NEVER commit a real value; supply through the environment (min 32 characters).
ridelink.security.jwt-secret=${JWT_SECRET:}

# ---- Swagger / OpenAPI ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
